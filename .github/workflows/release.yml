# The whole workflow releases one commit, pinned by the `prepare` job and
# checked out by SHA everywhere else. Nothing reaches the remote -- no commit,
# no tag, nothing published -- until every JDK in the matrix has gone green
# against that exact commit, and the branch is proven not to have moved since.
# Publishing comes before tagging: the deploy is the irreversible step and the
# only one that can realistically fail, so the tag records a release that has
# already gone out rather than promising one that might not.
name: Release

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
  MAVEN_OPTS: -Xmx4g

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "New release version"
        required: true
      dryRun:
        description: "Rehearse the release without pushing or publishing anything"
        type: boolean
        required: false
        default: false

# Everything that writes to the repository -- the tag push and the version
# bump -- authenticates with FINOS_GITHUB_TOKEN, so GITHUB_TOKEN itself never
# needs more than read access. Applies to the called build-and-test workflow
# too: a called workflow inherits the caller's permissions and can only
# narrow them further.
permissions:
  contents: read

# A release pushes a tag and one version-bump commit, so two runs at once
# would race each other. Never cancel one in flight: a release killed between
# pushing the tag and publishing needs the manual `Clean repo after failed
# release` workflow to recover.
# Dry runs get their own lane -- they push nothing, so there is no reason to
# make a real release queue behind an hour of rehearsal.
concurrency:
  group: release-${{ github.repository }}-${{ inputs.dryRun }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      branch: ${{ steps.pin.outputs.branch }}
      release-version: ${{ steps.versions.outputs.release }}
      development-version: ${{ steps.versions.outputs.development }}
      tag: ${{ steps.versions.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Pin the commit to release
        id: pin
        run: |
          set -euo pipefail
          # Everything downstream checks this SHA out explicitly, so the code
          # that gets tagged and published is the code the matrix tested.
          # actions/checkout already pins to GITHUB_SHA rather than the branch
          # tip, but that is an implicit default; if it ever stopped holding,
          # an untested commit could be published. Assert it rather than
          # trusting it.
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *)
              echo "::error::A release must be dispatched from a branch; got ${GITHUB_REF}."
              exit 1
              ;;
          esac
          branch="${GITHUB_REF#refs/heads/}"
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::error::Working tree is at ${head}, but this run was triggered for ${GITHUB_SHA}."
            exit 1
          fi
          tip="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "::error::${branch} already moved to ${tip} after this run was dispatched for ${GITHUB_SHA}. Re-run the release."
            exit 1
          fi
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Compute versions
        id: versions
        env:
          # Via the environment, never interpolated into the script: a
          # workflow input is attacker-controlled as far as the shell cares.
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${RELEASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::releaseVersion must be MAJOR.MINOR.PATCH; got '${RELEASE_VERSION}'."
            exit 1
          fi
          # The branch has to be on a snapshot, and the release must not go
          # backwards from it. The tag check below catches re-releasing a
          # version that shipped; this catches a typo that names one which
          # never did, which nothing else would notice.
          current="$(python3 -c 'import xml.etree.ElementTree as ET; ns="{http://maven.apache.org/POM/4.0.0}"; print(ET.parse("pom.xml").getroot().find(ns + "properties").find(ns + "revision").text)')"
          case "${current}" in
            *-SNAPSHOT) ;;
            *)
              echo "::error::The root pom is at ${current}, not a snapshot; this branch is not in a releasable state."
              exit 1
              ;;
          esac
          base="${current%-SNAPSHOT}"
          if [ "$(printf '%s\n%s\n' "${base}" "${RELEASE_VERSION}" | sort -V | head -n 1)" != "${base}" ]; then
            echo "::error::releaseVersion ${RELEASE_VERSION} is below the branch's current version ${current}."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${RELEASE_VERSION}"
          development="${major}.${minor}.$((patch + 1))-SNAPSHOT"
          # The tag is pushed onto the tested commit itself; nothing is committed first.
          tag="legend-pure-${RELEASE_VERSION}"
          if git ls-remote --exit-code origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists; ${RELEASE_VERSION} has been released."
            exit 1
          fi
          echo "release=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "development=${development}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: would release ${GITHUB_REF#refs/heads/} at ${GITHUB_SHA} as ${tag} (next development version ${development}). Nothing will be pushed or published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Releasing ${GITHUB_REF#refs/heads/} at ${GITHUB_SHA} as ${tag} (next development version ${development})." >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    # The build-once, test-on-every-JDK pipeline, shared with `Build CI` so
    # that a release is tested exactly the way ordinary CI tests. Pinned to
    # the one commit the `prepare` job resolved.
    needs: prepare
    uses: ./.github/workflows/build-and-test.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      # A release always exercises every supported JDK, whatever branch it
      # was cut from.
      jdks: '[25, 21, 17, 11, 8]'
    secrets: inherit

  release:
    name: Release
    # Publish only once every JDK has gone green against the pinned commit.
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    env:
      RELEASE_BRANCH: ${{ needs.prepare.outputs.branch }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release-version }}
      DEVELOPMENT_VERSION: ${{ needs.prepare.outputs.development-version }}
    steps:
      - name: Checkout the pinned commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}
          # The token has to stay in the working copy's git config: the tag
          # push and the version-bump push below authenticate with it from
          # inside this checkout.
          persist-credentials: true

      - name: Configure git
        run: |
          git config --global user.email "37706051+finos-admin@users.noreply.github.com"
          git config --global user.name "FINOS Administrator"

      - name: Verify nothing landed while the tests ran
        run: |
          set -euo pipefail
          # The version bump at the end of this run commits onto the tested
          # commit, so a branch that has moved turns that push into a
          # non-fast-forward and the release fails after publishing. Fail here
          # instead, before anything has been tagged or deployed, with a
          # message that says what happened. This is not the only guard: that
          # push is plain and never forced, so git still rejects it if the
          # branch moves between this check and the bump.
          tip="$(git ls-remote origin "refs/heads/${RELEASE_BRANCH}" | cut -f1)"
          if [ "${tip}" != "${RELEASE_SHA}" ]; then
            echo "::error::${RELEASE_BRANCH} moved from ${RELEASE_SHA} to ${tip} while the build and test jobs ran. Nothing has been tagged or published; re-run the release so the new commits get built and tested too."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_TAG} appeared while this run was in flight."
            exit 1
          fi

      - name: Restore Maven dependencies
        # The deploy below builds against this runner's ~/.m2, so without
        # this it resolves every dependency cold. Restore-only: the poms here
        # are the ones the `verify` build already cached under this exact key.
        uses: actions/cache/restore@v5
        env:
          cache-name: cache-mvn-deps
        with:
          # Never restore this project's own artifacts: the release build has
          # to produce its own, not pick up a cached copy.
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/finos/legend/pure
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      - name: Verify the release version resolves in every pom
        # The one thing that cannot wait for the deploy. Everything else the
        # deploy might get wrong -- a jar that will not compile, javadoc that
        # will not build, a gpg key that is not there -- fails it before
        # central-publishing-maven-plugin uploads anything, because that
        # plugin assembles its bundle at the end of the reactor. A pom that
        # still carries the revision property is different: it uploads
        # happily, autoPublish puts it on Maven Central, and it cannot be
        # withdrawn. So run flatten-maven-plugin on its own first -- the same
        # goal the build runs at process-resources, and seconds rather than
        # minutes.
        run: |
          set -euo pipefail
          mvn -B -q -Drevision="${RELEASE_VERSION}" flatten:flatten
          if grep -rlF '${revision}' --include='.flattened-pom.xml' .; then
            echo "::error::A pom above still carries an unresolved revision property; flatten-maven-plugin did not resolve it."
            exit 1
          fi
          count="$(find . -name .flattened-pom.xml | wc -l)"
          echo "${count} poms flattened to ${RELEASE_VERSION}"
          [ "${count}" -gt 0 ]

      - name: Build release
        # Dry runs only. On a real release the deploy below is this build --
        # there is no reason to compile the reactor twice when nothing is
        # tagged until the deploy has succeeded. A rehearsal still has to
        # compile, sign and package, though, or it would stop catching the
        # release-only failures it exists for. Tests are skipped because the
        # `verify` job already ran the whole suite on every supported JDK
        # against this exact commit.
        if: ${{ inputs.dryRun }}
        run: mvn -B -e -T 4 -DskipTests -Drevision="${RELEASE_VERSION}" clean install -P release
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=90.0

      - name: Verify the release artifacts carry the release version
        # The rehearsal's stronger form of the flatten check above: these are
        # the poms that were actually installed, which is what a real release
        # would deploy.
        if: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail
          if find ~/.m2/repository/org/finos/legend/pure -path "*/${RELEASE_VERSION}/*" -name '*.pom' | xargs grep -l '\${revision}'; then
            echo "::error::A published pom still contains \${revision}; flatten-maven-plugin did not run."
            exit 1
          fi
          count="$(find ~/.m2/repository/org/finos/legend/pure -path "*/${RELEASE_VERSION}/*" -name '*.pom' | wc -l)"
          echo "${count} poms resolved to ${RELEASE_VERSION}"
          [ "${count}" -gt 0 ]

      - name: Report the dry run
        if: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail
          {
            echo "## Dry run: release ${RELEASE_VERSION} would have gone ahead"
            echo
            echo "Checked, without touching the remote:"
            echo
            echo "- ${RELEASE_BRANCH} pinned at ${RELEASE_SHA}, green on every supported JDK"
            echo "- ${RELEASE_BRANCH} has not moved since, and ${RELEASE_TAG} does not exist yet"
            echo "- the release build with -Drevision=${RELEASE_VERSION} succeeded and every pom resolved"
            echo "- the next development version would be ${DEVELOPMENT_VERSION}"
            echo
            echo "Not run: deploying to Maven Central, pushing ${RELEASE_TAG}, and the bump to ${DEVELOPMENT_VERSION}."
            echo "Dispatch again with dryRun unchecked to release for real."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy release
        # The point of no return, and the gate: this is the only build a real
        # release runs, so a failure anywhere in it -- compile, javadoc, gpg,
        # upload, Central validation -- means nothing was published, no tag
        # was created, and there is nothing to clean up.
        #
        # `clean` costs nothing on a workspace only the dry-run build above
        # touches, and keeps what gets published independent of whatever this
        # job grows above it. release:perform got the same guarantee by
        # building in a fresh target/checkout.
        #
        # No -T: central-publishing-maven-plugin (extensions=true, from the
        # org.finos:finos parent) defers every module's artifacts and uploads
        # one bundle for the whole reactor at the end. Under Maven's parallel
        # builder that aggregation deadlocks -- every thread ends up stuck on
        # "Waiting for other projects build to finish..." indefinitely.
        id: deploy
        if: ${{ !inputs.dryRun }}
        run: mvn -B -e -DskipTests -Drevision="${RELEASE_VERSION}" clean deploy -P release
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=90.0

      - name: Push the release tag
        if: ${{ !inputs.dryRun }}
        run: |
          set -euo pipefail
          # Maven Central has already validated the deploy above, so this
          # records a release that has gone out rather than promising one.
          # The tag goes on the tested commit itself; the branch is not
          # touched here, so nothing can race it. If this step is what fails,
          # the release is published and only the tag is missing -- pushing it
          # by hand afterwards costs nothing and blocks nothing.
          git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
          pushed="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref { print $1 }')"
          if [ "${pushed}" != "${RELEASE_SHA}" ]; then
            echo "::error::Remote tag ${RELEASE_TAG} is ${pushed}, not ${RELEASE_SHA}."
            exit 1
          fi

      - name: Bump to the next development version
        if: ${{ !inputs.dryRun }}
        run: |
          set -euo pipefail
          # Committed onto the tested commit, never onto whatever the remote
          # tip has become, so the push below is a plain fast-forward: if
          # anything landed on the branch after the check above, git rejects it
          # rather than reverting a <revision> somebody else changed. The
          # release is already published by then, which is why the recovery
          # summary covers setting <revision> by hand.
          git checkout -B "${RELEASE_BRANCH}" "${RELEASE_SHA}"
          sed -i "s|<revision>.*</revision>|<revision>${DEVELOPMENT_VERSION}</revision>|" pom.xml
          if git diff --quiet -- pom.xml; then
            echo "::error::sed left pom.xml unchanged; set <revision> to ${DEVELOPMENT_VERSION} by hand on ${RELEASE_BRANCH}."
            exit 1
          fi
          git add pom.xml
          git commit -m "Bump version to ${DEVELOPMENT_VERSION}"
          git push origin "${RELEASE_BRANCH}"

      - name: Explain how to recover
        # Deliberately advice, not an automatic rollback: autoPublish is on and
        # a release that reached Maven Central cannot be withdrawn, so what to
        # do about it is a human decision. What this can do is remove the
        # guesswork. Deploying before tagging makes that easy: the deploy
        # step's own outcome says whether anything was published, so this
        # never has to send the reader off to check Maven Central by hand.
        # Cancellation as well as failure: a run killed between the deploy and
        # the tag push is exactly the case the concurrency comment above says
        # needs manual recovery, and `failure()` alone does not fire for it.
        if: ${{ failure() || cancelled() }}
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          # Never claim the tag is missing on a guess: a remote that cannot be
          # reached is not a remote without the tag.
          if tag_refs="$(git ls-remote origin "refs/tags/${RELEASE_TAG}")"; then
            remote_tag="$(awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref { print $1 }' <<< "${tag_refs}")"
          else
            remote_tag=unknown
          fi
          bump_advice() {
            echo "If the bump commit is missing, set <revision> in pom.xml to"
            echo "${DEVELOPMENT_VERSION} by hand on ${RELEASE_BRANCH} -- but look at what is"
            echo "on the branch first. That bump is pushed as a fast-forward from"
            echo "${RELEASE_SHA}, so it is rejected when somebody else pushed while this"
            echo "ran; if their commit set <revision> deliberately, keep their value"
            echo "rather than overwriting it."
          }
          {
            echo "## Release ${RELEASE_VERSION} did not finish"
            echo
            if [ "${DEPLOY_OUTCOME}" != "success" ]; then
              echo "**Nothing was published.** The deploy did not succeed, so"
              echo "central-publishing-maven-plugin never uploaded a bundle, ${RELEASE_TAG}"
              echo "was never pushed, and ${RELEASE_BRANCH} was not touched. Nothing needs"
              echo "cleaning up: deal with whatever stopped this run and dispatch the"
              echo "release again."
            elif [ "${remote_tag}" = unknown ]; then
              echo "**${RELEASE_VERSION} is published**, and the remote could not be reached"
              echo "to check whether ${RELEASE_TAG} was pushed. Confirm it by hand:"
              echo
              echo "       git ls-remote origin refs/tags/${RELEASE_TAG}"
              echo
              echo "If it is missing, push it -- the release is already out, so the tag is"
              echo "only recording it:"
              echo
              echo "       git tag ${RELEASE_TAG} ${RELEASE_SHA}"
              echo "       git push origin refs/tags/${RELEASE_TAG}"
              echo
              bump_advice
            elif [ -z "${remote_tag}" ]; then
              echo "**${RELEASE_VERSION} is published, but ${RELEASE_TAG} was not pushed.**"
              echo "The deploy succeeded, so the release is on Maven Central and cannot be"
              echo "withdrawn. The tag only records it, so push it by hand:"
              echo
              echo "       git tag ${RELEASE_TAG} ${RELEASE_SHA}"
              echo "       git push origin refs/tags/${RELEASE_TAG}"
              echo
              bump_advice
            else
              echo "**${RELEASE_VERSION} is published and tagged**, so this failed during the"
              echo "version bump. Nothing else needs doing to the release itself."
              echo
              bump_advice
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${DEPLOY_OUTCOME}" = "success" ]; then
            echo "::error::Release ${RELEASE_VERSION} was published but the run did not finish. See the job summary for what is left to do."
          fi
