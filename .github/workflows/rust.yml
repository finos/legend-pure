name: Rust CI

on:
  push:
    paths:
      - 'legend-pure-rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'legend-pure-rust/**'
      - '.github/workflows/rust.yml'

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legend-pure-rust

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install lld (faster linker)
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Enable lld for Rust compilation
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=lld" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            legend-pure-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('legend-pure-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Enable sccache as RUSTC_WRAPPER
        # A cache service outage degrades to an uncached build, not a failure.
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> $GITHUB_ENV

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Lint (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Doctests
        run: cargo test --workspace --doc

      - name: Check Copyright Headers
        run: ./scripts/check-copyright.sh

      - name: Documentation (no warnings)
        run: RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps
