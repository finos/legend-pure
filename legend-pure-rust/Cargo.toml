[workspace]
members = ["crates/metamodel", "crates/evaluator", "crates/jni"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/finos/legend-pure"

[workspace.dependencies]
smol_str = "0.3"
thiserror = "2"
rust_decimal = "1"
im-rc = "15"
jiff = { version = "0.2", features = ["std"] }
tracing = "0.1"
jni = "0.21"
slotmap = "1"

[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.test]
inherits = "dev"
